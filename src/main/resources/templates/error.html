<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Erreur')}"></head>
<body>
<main class="error-shell" id="contenu">
    <div class="error-card">
        <div class="error-code" th:text="${status} ?: 'Oups'">404</div>
        <h1 th:text="${status == 404} ? 'Page introuvable' : (${status == 403} ? 'Accès refusé' : 'Une erreur est survenue')">Une erreur est survenue</h1>
        <p th:text="${status == 404} ? 'La page que vous cherchez n\'existe pas ou a été déplacée.' : (${status == 403} ? 'Vous n\'avez pas les droits nécessaires pour accéder à cette page.' : 'Un problème est survenu de notre côté. Réessayez dans un instant.')">Un problème est survenu.</p>
        <p class="error-detail" th:if="${not #strings.isEmpty(message)}" th:text="${message}">Détail</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap mt-4">
            <a href="javascript:history.back()" class="btn secondary"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Page précédente</a>
            <a th:href="@{/dashboard}" class="btn"><i class="fa-solid fa-house" aria-hidden="true"></i> Tableau de bord</a>
        </div>
    </div>
</main>
</body>
</html>
