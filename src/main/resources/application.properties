spring.application.name=livraison
server.port=8083

# Base de donnees MySQL (a creer prealablement : CREATE DATABASE livraison_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/livraison_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# Parametres metier configurables (tarification)
livraison.tarif.base=2000
livraison.tarif.parKm=500
livraison.tarif.parKg=200
livraison.tarif.parM3=1500
livraison.tarif.majorationUrgente=0.20
livraison.tarif.majorationTresUrgente=0.40

# Ponderation du score d'attribution automatique des livreurs
livraison.score.poidsDistance=0.5
livraison.score.poidsCharge=0.3
livraison.score.poidsPriorite=0.2
